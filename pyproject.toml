[project]
name = "kwokcode"
version = "0.5.0"
description = "手撸一个 Code 智能体"
requires-python = ">=3.12"
dependencies = [
    "load-dotenv>=0.1.0",
    "openai>=1",
    "pydantic>=2",

    "mcp>=1",
    "textual>=8.2.8",
]

[project.scripts]
kwok = "kwok.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwok"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
# ANN401：协议层合法使用 Any 承载任意 JSON 负载（params/result/error.data）
ignore = ["ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
